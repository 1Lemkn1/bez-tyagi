name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Сайт живёт в подпапке репозитория: https://<логин>.github.io/bez-tyagi/
  NEXT_PUBLIC_BASE_PATH: /bez-tyagi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build

      # GitHub Pages отдаёт артефакт как есть, но .nojekyll защищает от
      # обработки папки _next как Jekyll-исключения.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
